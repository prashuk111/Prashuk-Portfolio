<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <linearGradient id="pjNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8ff3e"/>
      <stop offset="60%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <linearGradient id="pjWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="pjGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Premium Container Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#pjBg)" stroke="url(#pjNeon)" stroke-width="2.5"/>

  <!-- Subtle Ambient Core Glow -->
  <circle cx="50" cy="50" r="32" fill="#d8ff3e" fill-opacity="0.06"/>

  <!-- Interlocking Monogram Sign for PRASHUK JAIN -->
  <!-- 'P' Vertical Stem -->
  <path d="M30 22 V74" stroke="url(#pjNeon)" stroke-width="7" stroke-linecap="round"/>

  <!-- 'P' Upper Loop -->
  <path d="M30 24 H52 C64 24 71 31 71 40 C71 49 64 54 52 54 H30" stroke="url(#pjWhite)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 'J' Interlocking Curve -->
  <path d="M52 42 V62 C52 72 44 78 34 78 C25 78 19 73 17 67" stroke="url(#pjNeon)" stroke-width="7" stroke-linecap="round"/>

  <!-- Signature Electric Accent Dot -->
  <circle cx="72" cy="70" r="4.5" fill="#d8ff3e" filter="url(#pjGlow)"/>
</svg>